<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08883d" />
    <meta name="description" content="Agromax: gestión de ventas, inventario, caja y facturación para tu negocio agrícola." />
    <meta name="application-name" content="Agromax" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agromax" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/agromax-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/agromax-icon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="120x120" href="/brand/agromax-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/brand/agromax-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/brand/agromax-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/agromax-icon-180.png" />
    <title>Agromax</title>
    <style>
      body { margin: 0; }
      .agromax-startup { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; background: #f7f7ef; color: #183d2b; font-family: system-ui, sans-serif; text-align: center; }
      .agromax-startup img { width: 104px; height: 104px; border-radius: 24px; }
      .agromax-startup strong { font-size: 24px; }
      .agromax-startup p { margin: 0; font-size: 14px; }
    </style>
  </head>
  <body class="bg-gray-50">
    <div id="root">
      <div class="agromax-startup" role="status" aria-live="polite">
        <img src="/brand/agromax-icon-192.png" width="104" height="104" alt="" />
        <strong>Agromax</strong>
        <p>Cargando tu espacio de trabajo…</p>
        <noscript><p>Activa JavaScript en el navegador para utilizar Agromax.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
